name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: node bin/hoepli.mjs --version
      - name: the platform launcher is generated
        run: node -e "import('./src/install.mjs').then(m => { const p = process.platform; console.log(p, m.launcherName(p)); if (!m.linuxDesktopEntry().includes('Terminal=true')) process.exit(1); })"
